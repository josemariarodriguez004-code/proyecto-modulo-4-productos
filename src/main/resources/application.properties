spring.application.name=gestion-productos
server.port=8081
# H2 en memoria: los productos desaparecen al detener la aplicación.
spring.datasource.url=jdbc:h2:mem:inventario;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
# Exige los tipos JSON del contrato: números para precio/cantidad y nombres para el enum.
spring.jackson.deserialization.fail-on-numbers-for-enums=true
spring.jackson.mapper.allow-coercion-of-scalars=false
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
